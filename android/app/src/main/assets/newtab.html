<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yeni sekme</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: system-ui, -apple-system, Roboto, sans-serif;
    color: #f8fafc;
    background: radial-gradient(1200px 600px at 10% -10%, #14532d 0%, transparent 60%),
                radial-gradient(900px 500px at 110% 10%, #1e3a8a 0%, transparent 55%),
                linear-gradient(160deg, #0b1120 0%, #111827 60%, #0f172a 100%);
    display: flex; flex-direction: column; align-items: center; padding: 28px 18px 40px;
  }
  .stats { display: flex; gap: 28px; width: 100%; max-width: 520px; margin-top: 8px; }
  .stat .n { font-size: 30px; font-weight: 700; }
  .stat .n.green { color: #4ade80; }
  .stat .n.blue { color: #93c5fd; }
  .stat .l { font-size: 12px; color: #cbd5e1; margin-top: 2px; }
  .brand { margin: 44px 0 18px; font-size: 40px; font-weight: 800; letter-spacing: -1px; }
  .brand span { color: #4ade80; }
  a.search {
    display: flex; align-items: center; gap: 10px; width: 100%; max-width: 520px;
    padding: 14px 18px; border-radius: 26px; background: rgba(255,255,255,.12);
    color: #e2e8f0; text-decoration: none; font-size: 16px; backdrop-filter: blur(6px);
  }
  .grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 10px;
    width: 100%; max-width: 520px; margin-top: 34px;
  }
  .tile { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #e2e8f0; font-size: 12px; }
  .tile .ic {
    width: 54px; height: 54px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px;
  }
  .foot { margin-top: auto; padding-top: 36px; font-size: 11px; color: #64748b; text-align: center; }
</style>
</head>
<body>
  <div class="stats">
    <div class="stat"><div class="n green">{{BLOCKED}}</div><div class="l">Engellenen reklam ve izleyici</div></div>
    <div class="stat"><div class="n blue">{{SAVED}}</div><div class="l">Kazanılan süre</div></div>
  </div>
  <div class="brand">Zet<span>.</span></div>
  <a class="search" href="zet://focus">🔍&nbsp; Ara veya adres yaz</a>
  <div class="grid">
    <a class="tile" href="https://m.youtube.com"><div class="ic" style="background:#dc2626">▶</div>YouTube</a>
    <a class="tile" href="https://www.google.com"><div class="ic" style="background:#2563eb">G</div>Google</a>
    <a class="tile" href="https://tr.m.wikipedia.org"><div class="ic" style="background:#475569">W</div>Vikipedi</a>
    <a class="tile" href="https://x.com"><div class="ic" style="background:#0f172a;border:1px solid #334155">X</div>X</a>
    <a class="tile" href="https://www.instagram.com"><div class="ic" style="background:#c026d3">I</div>Instagram</a>
    <a class="tile" href="https://www.reddit.com"><div class="ic" style="background:#ea580c">R</div>Reddit</a>
    <a class="tile" href="https://eksisozluk.com"><div class="ic" style="background:#65a30d">E</div>Ekşi</a>
    <a class="tile" href="https://github.com"><div class="ic" style="background:#334155">⌥</div>GitHub</a>
  </div>
  <div class="foot">{{MODE}}</div>
</body>
</html>
