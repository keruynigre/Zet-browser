name: Android APK + Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - name: cargo-ndk kurulumu
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Rust testleri
        run: cargo test --workspace

      - name: JavaScript testleri
        run: |
          node crates/zet-core/tests/js/youtube_adblock.test.mjs
          node crates/zet-core/tests/js/youtube_background.test.mjs

      - name: Rust çekirdeğini Android için derle
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o android/app/src/main/jniLibs \
            build --release -p zet-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK derle
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: APK'yı yeniden adlandır
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk zet-browser.apk
          ls -la zet-browser.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zet-browser-apk
          path: zet-browser.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust kurulumu
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Windows sürümünü derle
        env:
          ZET_BUILD: ${{ github.run_number }}
        run: cargo build --release -p zet-desktop

      - name: Dosyayı yeniden adlandır
        shell: bash
        run: |
          cp target/release/zet-browser.exe zet-browser-windows.exe
          ls -la zet-browser-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: zet-browser-windows
          path: zet-browser-windows.exe

  release:
    # Windows derlemesi başarısız olsa da Android sürümü yayınlansın.
    needs: [build, windows]
    if: always() && needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - name: GitHub Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Zet ${{ github.run_number }}
          body: |
            ${{ github.event.head_commit.message }}

            Commit: ${{ github.sha }}
            Telefon: `zet-browser.apk` · Windows: `zet-browser-windows.exe`
          files: dist/*
          make_latest: true
