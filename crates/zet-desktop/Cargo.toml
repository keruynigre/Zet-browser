[package]
name = "zet-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Zet Browser Windows masaüstü kabuğu (tao + wry / WebView2)"

[[bin]]
name = "zet-browser"
path = "src/main.rs"

[features]
default = ["tor"]
tor = ["dep:zet-tor"]

[dependencies]
zet-core = { path = "../zet-core" }
zet-tor = { path = "../zet-tor", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tao = "0.38"
wry = "0.58"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }
