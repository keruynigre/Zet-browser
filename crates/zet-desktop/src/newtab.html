<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yeni sekme</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: system-ui, "Segoe UI", sans-serif; color: #f8fafc;
    background: radial-gradient(1200px 600px at 10% -10%, #14532d 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #1e3a8a 0%, transparent 55%),
      linear-gradient(160deg, #0b1120 0%, #111827 60%, #0f172a 100%);
    display: flex; flex-direction: column; align-items: center; padding: 9vh 20px 40px; }
  h1 { font-size: 44px; margin: 0 0 22px; letter-spacing: 1px; }
  h1 span { color: #4ade80; }
  form { width: 100%; max-width: 620px; }
  input { width: 100%; height: 50px; border-radius: 25px; border: 0; padding: 0 22px; font-size: 16px;
    background: rgba(255,255,255,.95); color: #111827; outline: none; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  .stats { display: flex; gap: 40px; margin: 28px 0 8px; }
  .stat .n { font-size: 30px; font-weight: 700; color: #4ade80; }
  .stat .l { font-size: 13px; color: #94a3b8; }
  .tiles { display: grid; grid-template-columns: repeat(4, 96px); gap: 18px; margin-top: 30px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; color: #e2e8f0; text-decoration: none;
    font-size: 13px; }
  .tile .ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 22px;
    font-weight: 700; color: #fff; position: relative; overflow: hidden; }
  .tile .ic img { position: absolute; width: 28px; height: 28px; }
  .tile:hover .ic { transform: translateY(-2px); }
  .mode { margin-top: 14px; color: #c4b5fd; font-size: 14px; }
</style>
</head>
<body>
<h1>Z<span>e</span>t</h1>
<form id="f"><input id="q" placeholder="Ara veya adres yaz" autofocus autocomplete="off"></form>
<div class="mode" id="mode"></div>
<div class="stats">
  <div class="stat"><div class="n" id="blocked">0</div><div class="l">engellenen reklam ve izleyici</div></div>
</div>
<div class="tiles" id="tiles"></div>
<script>
  var sites = [['YouTube', 'https://www.youtube.com', '#dc2626'], ['Google', 'https://www.google.com', '#2563eb'],
    ['Vikipedi', 'https://tr.wikipedia.org', '#475569'], ['X', 'https://x.com', '#0f766e'],
    ['Reddit', 'https://www.reddit.com', '#ea580c'], ['GitHub', 'https://github.com', '#7c3aed'],
    ['Ekşi', 'https://eksisozluk.com', '#65a30d'], ['Instagram', 'https://www.instagram.com', '#c026d3']];
  var h = '';
  sites.forEach(function (s) {
    h += '<a class="tile" href="' + s[1] + '"><div class="ic" style="background:' + s[2] + '"><span>' + s[0][0] +
      '</span><img src="' + s[1] + '/favicon.ico" alt="" onload="this.previousSibling.remove();this.parentNode.style.background=\'#fff\'" onerror="this.remove()"></div>' + s[0] + '</a>';
  });
  document.getElementById('tiles').innerHTML = h;
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (v) window.ipc.postMessage(JSON.stringify({ t: 'go', text: v }));
  });
  window.zetNtp = function (d) {
    document.getElementById('blocked').textContent = d.blocked.toLocaleString('tr-TR');
    document.getElementById('mode').textContent = d.mode;
  };
  window.ipc.postMessage(JSON.stringify({ t: 'ntp' }));
</script>
</body>
</html>
